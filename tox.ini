[tox]
envlist = py{310,314}, coverage, readme, style

[testenv]
passenv = HOME
setenv = COVERAGE_FILE={toxworkdir}/.coverage.{envname}
usedevelop = True
deps = -rrequirements.txt
       -rtests/requirements.txt
commands = pytest {posargs:-vv --cov=src/ --cov=tests/ --cov-report=xml tests/}

[testenv:coverage]
setenv = COVERAGE_FILE={toxworkdir}/.coverage
skip_install = True
deps = coverage
commands = coverage combine
           coverage report -m
           coverage xml
           coverage html

[testenv:readme]
# Verify that README.rst renders properly on PyPI
skip_install = True
deps = twine
       uv
commands = uv build -q -o {env_dir}/dist
           twine check --strict {env_dir}/dist/*

[testenv:style]
skip_install = True
deps = ruff
       vermin
# bstrap.py is standalone (used to get pickley), it must keep running on old pythons
commands = ruff check
           ruff format --diff
           vermin -t=3.6- --no-tips --violations src/pickley/bstrap.py

[testenv:reformat]
skip_install = True
deps = ruff
commands = ruff check --fix
           ruff format

# Type checkers
[testenv:basedpyright]
# setuptools: for setup.py's import to resolve (uv venvs don't include it)
deps = basedpyright
       setuptools
       -rrequirements.txt
       -rtests/requirements.txt
# Without --pythonpath, basedpyright resolves imports against ./.venv rather than this tox env
commands = basedpyright --pythonpath {envpython} {posargs}

[testenv:mypy]
# types-setuptools: unlike the other checkers, mypy insists on separate stubs for it
deps = mypy
       types-setuptools
       -rrequirements.txt
       -rtests/requirements.txt
commands = mypy {posargs}

[testenv:pyrefly]
# setuptools: for setup.py's import to resolve (uv venvs don't include it)
deps = pyrefly
       setuptools
       -rrequirements.txt
       -rtests/requirements.txt
commands = pyrefly check {posargs}

[testenv:pyright]
# setuptools: for setup.py's import to resolve (uv venvs don't include it)
deps = pyright
       setuptools
       -rrequirements.txt
       -rtests/requirements.txt
commands = pyright {posargs}

[testenv:ty]
# setuptools: for setup.py's import to resolve (uv venvs don't include it)
deps = ty
       setuptools
       -rrequirements.txt
       -rtests/requirements.txt
commands = ty check {posargs}

[testenv:zuban]
# types-setuptools: zuban, like mypy, insists on separate stubs for it
deps = zuban
       types-setuptools
       -rrequirements.txt
       -rtests/requirements.txt
# Without --python-executable, zuban doesn't resolve imports against this tox env
commands = zuban check --python-executable {envpython} {posargs}

[testenv:package-pip]
changedir = {envdir}
commands = pickley --package-manager=pip package "{toxinidir}" -droot/apps -sroot:root/usr/local/bin

[testenv:package-uv]
changedir = {envdir}
commands = pickley --package-manager=uv package "{toxinidir}" -droot/apps -sroot:root/usr/local/bin

[testenv:nuitka]
deps = nuitka
       -rrequirements.txt
       -rtests/requirements.txt
commands = python -mnuitka --standalone --output-dir=.tox/nuitka/ src/pickley

[testenv:pyinstaller]
usedevelop = True
deps = PyInstaller
commands = pyinstaller --clean -Fy --distpath .tox/pyinstaller/dist --specpath .tox/pyinstaller -n pickley src/pickley/__main__.py

[coverage:run]
concurrency =
    thread
patch = subprocess
[coverage:xml]
output = .tox/test-reports/coverage.xml
[coverage:html]
directory = .tox/test-reports/htmlcov

[pytest]
cache_dir = .tox/pytest_cache
